<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>OG Image Generator - POD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#19272B',
                            light: '#23343A',
                            lighter: '#2E4249',
                            accent: '#38bdf8',
                            accentGlow: 'rgba(56, 189, 248, 0.15)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .bg-grid {
            background-size: 60px 60px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-10">

    <!--
        OG Image Container
        Size: 1200x630px
    -->
    <div id="capture" class="relative w-[1200px] h-[630px] bg-brand text-slate-300 font-sans overflow-hidden shadow-2xl">

        <!-- Background Elements -->
        <div class="absolute inset-0 z-0">
            <div class="absolute top-0 left-0 w-full h-full bg-grid"></div>
            <!-- Glow Effects -->
            <div class="absolute top-[-20%] left-[20%] w-[600px] h-[600px] bg-brand-accent/10 rounded-full blur-[120px]"></div>
            <div class="absolute bottom-[-10%] right-[10%] w-[500px] h-[500px] bg-teal-500/10 rounded-full blur-[100px]"></div>
        </div>

        <!-- Content Content -->
        <div class="relative z-10 w-full h-full flex flex-col items-center justify-center p-16">

            <!-- Logo Section -->
            <div class="flex items-center gap-4 mb-10 transform scale-125">
                <div class="relative w-16 h-16 flex items-center justify-center bg-brand-lighter rounded-2xl border border-white/10 shadow-[0_0_30px_rgba(56,189,248,0.2)]">
                    <iconify-icon icon="lucide:layers" width="40" class="text-brand-accent"></iconify-icon>
                </div>
                <div class="flex flex-col">
                    <span class="text-white font-bold tracking-tighter text-4xl leading-none mb-1">
                        POD
                    </span>
                    <span class="text-lg text-slate-400 uppercase tracking-[0.2em] leading-none">
                        Pay On Delight
                    </span>
                </div>
            </div>

            <!-- Main Heading -->
            <div class="text-center space-y-6 max-w-4xl">
                <h1 class="text-6xl font-extrabold text-white tracking-tight leading-tight">
                    Phát triển Website & Web App
                    <br/>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-accent to-teal-400">
                        HOÀN TOÀN MIỄN PHÍ
                    </span>
                </h1>

                <div class="text-3xl font-medium text-slate-400 mt-4">
                    Demo trong 1 tuần <span class="mx-3 text-slate-600">•</span> Trả phí khi hài lòng
                </div>
            </div>

            <!-- Bottom Badge -->
            <div class="absolute bottom-12 flex gap-8">
                <div class="flex items-center gap-3 px-6 py-3 bg-white/5 backdrop-blur-sm rounded-full border border-white/10">
                    <iconify-icon icon="lucide:zap" width="24" class="text-yellow-400"></iconify-icon>
                    <span class="text-xl font-medium text-white">Nhanh chóng</span>
                </div>
                <div class="flex items-center gap-3 px-6 py-3 bg-white/5 backdrop-blur-sm rounded-full border border-white/10">
                    <iconify-icon icon="lucide:shield-check" width="24" class="text-brand-accent"></iconify-icon>
                    <span class="text-xl font-medium text-white">An toàn</span>
                </div>
                <div class="flex items-center gap-3 px-6 py-3 bg-white/5 backdrop-blur-sm rounded-full border border-white/10">
                    <iconify-icon icon="lucide:code-2" width="24" class="text-purple-400"></iconify-icon>
                    <span class="text-xl font-medium text-white">Hiện đại</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
